x-app: &app
  build: .
  environment:
    DATABASE_URL: postgresql://atlas:${POSTGRES_PASSWORD:?Run python scripts/init_env.py}@postgres:5432/atlas
  networks: [backend]
  read_only: true
  tmpfs: [/tmp:size=64m]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 512m
  cpus: 1
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: atlas
      POSTGRES_DB: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/init_env.py}
    volumes: [database:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U atlas -d atlas"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    <<: *app
    command: [atlas, migrate]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *app
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/ready')"]
      interval: 3s
      timeout: 6s
      retries: 20
  worker:
    <<: *app
    command: [python, -m, atlas.worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  console:
    build: ui
    ports: ["127.0.0.1:3000:8080"]
    networks: [backend]
    depends_on:
      api: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/]
      interval: 3s
      timeout: 3s
      retries: 20
  integration:
    <<: *app
    profiles: [test]
    environment:
      DATABASE_URL: postgresql://atlas:${POSTGRES_PASSWORD}@postgres:5432/atlas
      ATLAS_URL: http://api:8080
    volumes: [./tests:/app/tests:ro]
    command: [python, /app/tests/integration.py]
volumes:
  database:
networks:
  backend:
    internal: true
