name: Publish source
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  publish:
    if: github.actor == 'Karthikvk1899'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Write reviewed source
        shell: python
        run: |
          import base64, json, pathlib, zlib
          files = json.loads(zlib.decompress(base64.b64decode("")))
          for name, content in files.items():
              path = pathlib.Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content)
      - name: Commit source
        run: |
          git config user.name 'Karthik Beesa'
          git config user.email '261053759+Karthikvk1899@users.noreply.github.com'
          git add .
          git commit -m 'Separate loopback ingress from isolated worker networking'
          git push
