name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install -e '.[test]'
      - run: ruff check atlas tests scripts && ruff format --check atlas tests scripts
      - run: pytest -q
      - run: pip-audit -r requirements.lock
      - run: python scripts/contracts.py && git diff --exit-code docs/openapi.json docs/execution.schema.json
  console:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults: {run: {working-directory: ui}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24', cache: npm, cache-dependency-path: ui/package-lock.json}
      - run: npm ci
      - run: npm test && npm run build
      - run: npm audit --audit-level=moderate
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24', cache: npm, cache-dependency-path: ui/package-lock.json}
      - run: npm ci --prefix ui
      - run: cd ui && npx playwright install --with-deps chromium
      - name: Start documented quickstart with two workers
        run: |
          python scripts/init_env.py
          docker compose up -d --build --wait --scale worker=2
          curl --fail --retry 10 --retry-connrefused http://127.0.0.1:3000/ > /dev/null
          curl --fail --retry 10 --retry-connrefused http://127.0.0.1:8080/health/ready
      - name: Real API, database, concurrency, replay and MCP tests
        run: docker compose --profile test run --rm --no-deps integration
      - name: Browser evidence
        run: |
          docker compose exec -T api python < scripts/browser_seed.py > /tmp/atlas-browser-credentials.json
          chmod 600 /tmp/atlas-browser-credentials.json
          cd ui && npm run e2e
      - name: Dependency interruption and backup restore
        run: python scripts/operations_test.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: browser-evidence
          path: |
            ui/test-results/
            ui/playwright-report/
          retention-days: 7
      - if: failure()
        run: docker compose logs --no-color --tail=100
      - if: always()
        run: docker compose down -v
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: python,javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
