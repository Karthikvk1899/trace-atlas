[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "trace-atlas"
version = "0.1.0"
description = "Evidence-backed distributed execution investigation and bounded HTTP replay"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.163.1,<1", "starlette>=1.3.1,<2", "uvicorn>=0.34,<1", "psycopg[binary,pool]>=3.2,<4", "httpx>=0.28,<1", "prometheus-client>=0.21,<1", "mcp>=1.26,<2"]
[project.optional-dependencies]
test = ["pytest>=9.2,<10", "ruff>=0.11,<1", "pip-audit>=2.9,<3", "pip-tools>=7,<8"]
[project.scripts]
atlas = "atlas.cli:main"
[tool.setuptools]
packages = ["atlas"]
[tool.setuptools.package-data]
atlas = ["schema.sql"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]
